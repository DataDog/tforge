version: "2"

run:
  timeout: 5m
  go: "1.22"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosimple
    - gofmt
    - misspell
    - errorlint
    - bodyclose
    - noctx

formatters:
  enable:
    - gofmt

linters-settings:
  errorlint:
    errorf: true
    asserts: true
    comparison: true

issues:
  exclude-dirs:
    - example
  exclude-rules:
    - path: "_gen\\.go$"
      linters:
        - all
