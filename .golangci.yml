version: "2"

run:
  timeout: 5m
  go: "1.22"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
    - errorlint
    - bodyclose
    - noctx
  settings:
    errorlint:
      errorf: true
      asserts: true
      comparison: true
  exclusions:
    paths:
      - example
      - third_party
    rules:
      - path: "_gen\\.go$"
        linters:
          - all
    generated: lax

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - example
