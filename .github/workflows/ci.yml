name: CI

on:
  push:
    branches:
      - main
      # The merge queue waits for these checks on its working branches.
      - mq-working-branch-**
  # Run on every PR regardless of base branch. Without this, Graphite-style
  # stacked PRs (whose base is an intermediate feature branch, not `main`)
  # never trigger CI; only the bottom PR of the stack would.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: "v2.11.4"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Install golangci-lint
        env:
          GOLANGCI_LINT_VERSION: ${{ env.GOLANGCI_LINT_VERSION }}
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b $(go env GOPATH)/bin "$GOLANGCI_LINT_VERSION"

      - name: Lint
        run: make lint

  license-check:
    name: License Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Install go-licenses
        run: go install github.com/google/go-licenses@v1.6.0

      - name: Check dependency licenses against allow-list
        run: go-licenses check ./cmd/... ./config/... ./generate/... ./provider/... ./render/... --allowed_licenses=MIT,Apache-2.0,BSD-3-Clause,BSD-2-Clause,ISC

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: make coverage-check

      - name: Run generator round-trip fixture
        run: make handletest

      - name: Upload coverage
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-report
          path: coverage.out

  snapshots:
    name: Snapshot Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Install Terraform and OpenTofu
        run: scripts/install-iac-clis.sh

      - name: Run snapshot tests
        run: make snapshot-tests

  migration:
    name: Migration Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Install Terraform and OpenTofu
        run: scripts/install-iac-clis.sh

      - name: Run migration tests
        run: make migration-test

  validate-golden:
    name: Validate Golden Files
    needs: snapshots
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Validate golden files against Terraform and OpenTofu
        run: make validate-golden

  version-check:
    name: Version Bump Check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA"...HEAD | grep -qE '\.go$|^go\.(mod|sum)$|^VERSION$|^CHANGELOG\.md$'; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get PR version
        if: steps.changes.outputs.release == 'true'
        id: pr
        # Empty when the PR removes the VERSION file (rare). The Compare step
        # treats empty as "skip with warning" rather than failing.
        run: |
          if [ -f VERSION ]; then
            VERSION=$(tr -d '[:space:]' < VERSION)
          else
            VERSION=""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout base branch
        if: steps.changes.outputs.release == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Get base version
        if: steps.changes.outputs.release == 'true'
        id: base
        # Empty when this PR is the one introducing the VERSION file (the base
        # branch doesn't have it yet). Handled in the Compare step.
        run: |
          if [ -f base/VERSION ]; then
            VERSION=$(tr -d '[:space:]' < base/VERSION)
          else
            VERSION=""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        if: steps.changes.outputs.release == 'true'
        id: compare
        # Two-part check:
        #   1. Advisory only: warn (but don't fail) when the VERSION file wasn't
        #      bumped, or when the new value isn't greater than the base.
        #   2. Hard fail: when the VERSION file *is* bumped, CHANGELOG.md must
        #      contain a matching '## [<new>]' heading. A release commit
        #      without a changelog entry is hard to clean up after the tag is
        #      cut, so we block it at PR time.
        run: |
          PR="${{ steps.pr.outputs.version }}"
          BASE="${{ steps.base.outputs.version }}"
          if [ -z "$PR" ] || [ -z "$BASE" ]; then
            echo "::warning::Skipping version-bump comparison: VERSION file missing on $([ -z "$PR" ] && echo PR)$([ -z "$PR" ] && [ -z "$BASE" ] && echo " and ")$([ -z "$BASE" ] && echo "base branch (likely the PR that introduces the file)")."
            exit 0
          fi
          if [ "$PR" = "$BASE" ]; then
            echo "::warning::Version was not bumped. PR version ($PR) == base version ($BASE). Consider bumping the VERSION file."
            exit 0
          fi
          HIGHER=$(printf '%s\n%s' "$BASE" "$PR" | sort -V | tail -1)
          if [ "$HIGHER" != "$PR" ]; then
            echo "::warning::PR version ($PR) is not greater than base version ($BASE)."
            exit 0
          fi
          echo "Version bumped: $BASE -> $PR"
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::VERSION bumped to $PR but CHANGELOG.md is missing. Create CHANGELOG.md with a '## [$PR]' section."
            exit 1
          fi
          if ! grep -qE "^## \[$PR\]( |$)" CHANGELOG.md; then
            echo "::error::VERSION bumped to $PR but CHANGELOG.md has no '## [$PR]' heading. Add a changelog entry for this release."
            exit 1
          fi
          echo "Changelog entry for $PR found."

  auto-tag:
    name: Auto Tag Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, snapshots, migration, validate-golden]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: DataDog/dd-octo-sts-action@96a25462dbcb10ebf0bfd6e2ccc917d2ab235b9a # v1.0.4
        id: octo-sts
        with:
          scope: DataDog/tforge
          policy: gha.release.auto-tag

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          token: ${{ steps.octo-sts.outputs.token }}

      - name: Extract version and check tag
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists, skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist, will create."
          fi

      - name: Create and push tag
        if: steps.version.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a ${{ steps.version.outputs.tag }} -m "tforge ${{ steps.version.outputs.tag }}"
          git push origin ${{ steps.version.outputs.tag }}
