name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Run tests
        run: make coverage-check

  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          go build -ldflags "-s -w" -o tforge-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/tforge

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: tforge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tforge-${{ matrix.goos }}-${{ matrix.goarch }}

  publish:
    name: Publish GitHub Release
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Collect all binaries
          mkdir -p dist
          find artifacts -type f -name 'tforge-*' -exec cp {} dist/ \;
          chmod +x dist/*

          # Create release with auto-generated notes
          gh release create ${{ github.ref_name }} dist/* \
            --generate-notes \
            --title "tforge ${{ github.ref_name }}"

  notify-provider-repos:
    name: Notify Provider Repos
    needs: publish
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Dispatch to tforge-provider-datadog
        env:
          GH_TOKEN: ${{ secrets.TFORGE_PROVIDER_DISPATCH_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          gh api repos/DataDog/tforge-provider-datadog/dispatches \
            -f event_type=tforge-release \
            -f "client_payload[tforge_version]=$VERSION" \
            -f "client_payload[tforge_tag]=${{ github.ref_name }}"
