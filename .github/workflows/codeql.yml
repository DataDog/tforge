name: CodeQL

on:
  push:
    branches:
      - main
      # The merge queue waits for these checks on its working branches.
      - mq-working-branch-**
  pull_request:
  schedule:
    - cron: "30 4 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Initialize CodeQL
        uses: github/codeql-action/init@181d5eefc20863364f96762470ba6f862bdef56b # v3.29.9
        with:
          languages: go
          build-mode: manual

      - name: Build
        run: go build ./cmd/... ./config/... ./generate/... ./provider/... ./render/...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@181d5eefc20863364f96762470ba6f862bdef56b # v3.29.9
        with:
          category: "/language:go"
